<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#050a0a" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Admin — Xing-Z</title>
    <!-- Apply a saved light theme before first paint (see src/theme.jsx) -->
    <script>
      try {
        if (localStorage.getItem('xingz-theme') === 'light') {
          document.documentElement.dataset.theme = 'light'
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f3fbfa')
        }
      } catch (e) {}
    </script>
  </head>
  <body class="bg-page">
    <div id="root"></div>
    <script type="module" src="/src/admin-main.jsx"></script>
  </body>
</html>
