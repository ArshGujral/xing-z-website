<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <title>Xing-Z</title>
  <!-- Browsers that honour prefers-color-scheme in SVG icons (Chrome, Firefox) get a teal tile in light mode. -->
  <style>
    .tile { fill: #081414; stroke: #229784; }
    .z { fill: #a0d5cd; }
    .bolt { fill: #36b7a2; }
    @media (prefers-color-scheme: light) {
      .tile { fill: #229784; stroke: #1a7a6b; }
      .z, .bolt { fill: #ffffff; }
    }
  </style>
  <rect class="tile" x="1" y="1" width="62" height="62" rx="15" stroke-width="2"/>
  <g transform="translate(10 4) scale(.158)">
    <path class="z" d="M18 80h134l-96 112h54l-30 55H14v-32l85-102H18z"/>
    <path class="bolt" d="M233 0 154 150h56L43 354l84-161H67z"/>
  </g>
</svg>
