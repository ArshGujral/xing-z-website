<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the page run under the iPhone status bar and home indicator; safe-area insets in the CSS keep controls clear of them -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0706" />
    <title>Xing-Z — Copper-wound cooler motors &amp; pumps</title>
    <!-- Apply a saved light theme before first paint (see src/theme.jsx) -->
    <script>
      try {
        if (localStorage.getItem('xingz-theme') === 'light') {
          document.documentElement.dataset.theme = 'light'
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f8f4ef')
        }
      } catch (e) {}
    </script>
  </head>
  <body class="bg-page">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
